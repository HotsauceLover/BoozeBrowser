<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bradley's BoozeBrowser v0.4 Pass 1.3</title>
  <style>
    :root{
      --bg:#03050b; --panel:#090c16; --panel2:#0e1020; --chrome:#b8b8b8; --chromeDark:#787878;
      --hot:#ff3aa6; --cyan:#00e8ff; --purple:#5c22cc; --yellow:#ffd21c; --green:#8cff4a;
      --text:#f4eefe; --muted:#b7a7c4; --line:#ff3aa6; --blue:#174dcb; --danger:#ff4f6d;
      --shadow:0 0 10px rgba(255,58,166,.55),0 0 20px rgba(0,232,255,.18);
      --font-ui:"Trebuchet MS",Tahoma,Verdana,sans-serif; --font-mono:"Lucida Console","Courier New",monospace;
    }
    *{box-sizing:border-box} html,body{height:100%}
    body{margin:0;background:#000;color:var(--text);font-family:var(--font-ui);overflow-x:hidden;
      background-image:radial-gradient(circle at 20% 0%,rgba(255,58,166,.14),transparent 28%),radial-gradient(circle at 95% 20%,rgba(0,232,255,.13),transparent 24%),linear-gradient(180deg,#000 0%,#05020a 60%,#000 100%);
    }
    button,input,textarea,select{font:inherit} button{cursor:pointer}
    .app-wrap{width:min(100vw,430px);min-height:100dvh;margin:0 auto;padding:10px 8px 0;background:linear-gradient(180deg,#02020a,#050111);}
    .browser{border:2px solid var(--hot);box-shadow:var(--shadow);background:var(--panel);min-height:calc(100dvh - 12px);display:flex;flex-direction:column;position:relative;}
    .titlebar{height:28px;background:linear-gradient(90deg,#10195b,#161029,#9a005b);border-bottom:2px solid #111;display:flex;align-items:center;gap:7px;padding:2px 5px;color:white;font-family:var(--font-mono);font-size:11px;white-space:nowrap;}
    .titlebar .title{flex:1;overflow:hidden;text-overflow:ellipsis}.winbtn{width:22px;height:20px;border:2px outset #ddd;background:#bdbdbd;color:#111;font-weight:bold;line-height:14px;padding:0;font-family:var(--font-mono)}
    .toolbar{height:42px;background:#bdbdbd;border-bottom:2px solid #222;display:flex;align-items:center;gap:5px;padding:4px;color:#111;}
    .toolbtn{width:31px;height:30px;border:2px outset #fff;background:#c8c8c8;color:#111;font-size:18px;display:grid;place-items:center;padding:0}.toolbtn:active,.retro-btn:active{border-style:inset;transform:translateY(1px)}
    .toolbtn.disabled{opacity:.45;filter:grayscale(1);cursor:not-allowed}.address{flex:1;height:28px;border:2px inset #fff;background:white;color:#111;display:flex;align-items:center;padding:0 6px;font-family:var(--font-mono);font-size:9px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.fav-star{color:#111;background:#d7d7d7}.fav-star span{color:#ffd21c;text-shadow:1px 1px #111}
    .content{flex:1;padding:12px 10px 72px;position:relative;background:linear-gradient(rgba(0,232,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,58,166,.035) 1px,transparent 1px),radial-gradient(circle at 70% 10%,rgba(255,58,166,.08),transparent 24%);background-size:16px 16px,16px 16px,100% 100%;}
    .statusbar{height:23px;background:#101010;border-top:1px solid #aaa;color:#eee;display:flex;align-items:center;justify-content:space-between;padding:2px 6px;font-family:var(--font-mono);font-size:10px;position:absolute;bottom:49px;left:0;right:0}.status-left{color:var(--green)}.status-right{color:white}
    .bottomnav{height:49px;position:absolute;bottom:0;left:0;right:0;background:#c7c7c7;display:grid;grid-template-columns:repeat(5,1fr);border-top:2px solid #222}.navbtn{border:2px outset #fff;background:#bdbdbd;color:#111;font-size:10px;padding:2px 0;font-family:var(--font-ui)}.navbtn.active{background:linear-gradient(#6622c8,#31106d);color:white}.navbtn div:first-child{font-size:17px;line-height:18px}
    h1,h2,h3{margin:0}.logo{display:flex;gap:11px;align-items:center;margin:2px 0 12px}.logo-mark{font-size:44px;filter:drop-shadow(0 0 8px var(--hot))}.logo-text{font-family:var(--font-mono);font-size:28px;line-height:.95;color:var(--cyan);text-shadow:2px 2px var(--hot)}.logo-text b{color:var(--hot)}.tagline{font-family:var(--font-mono);font-size:10px;color:#eee;margin-top:6px;text-shadow:0 0 4px var(--cyan)}
    .section{border:1px solid var(--hot);box-shadow:0 0 8px rgba(255,58,166,.25);background:rgba(3,5,11,.76);padding:9px;border-radius:6px;margin:10px 0}.section-title{font-family:var(--font-mono);font-size:13px;color:var(--cyan);margin-bottom:7px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.row{display:flex;gap:8px;align-items:center}.between{display:flex;justify-content:space-between;gap:8px;align-items:center}.field{margin:9px 0}.field label{display:block;color:var(--hot);font-family:var(--font-mono);font-size:12px;margin-bottom:4px}.field input,.field textarea,.field select{width:100%;background:#07070b;color:var(--text);border:1px solid #7d2c67;box-shadow:inset 0 0 5px #000;padding:8px;border-radius:2px}.field textarea{min-height:72px;resize:vertical}.search-row{display:flex;gap:6px}.search-row input{flex:1;background:#f2f2f2;color:#111;border:2px inset #fff;padding:8px}.retro-btn{border:2px outset #e7dfff;background:linear-gradient(#7b25e2,#26006b);color:white;padding:9px 12px;border-radius:3px;box-shadow:0 0 6px rgba(0,232,255,.25);font-weight:700}.retro-btn.pink{background:linear-gradient(#ff59bb,#b70066);color:#111}.retro-btn.grey{background:#c8c8c8;color:#111}.retro-btn.blue{background:linear-gradient(#2774e8,#123681)}.retro-btn.full{width:100%}.small{font-size:11px;color:var(--muted)}.mono{font-family:var(--font-mono)}.cyan{color:var(--cyan)}.hot{color:var(--hot)}.yellow{color:var(--yellow)}
    .drink-card{display:grid;grid-template-columns:64px 1fr 30px;gap:9px;border:1px solid var(--hot);background:rgba(10,7,18,.92);border-radius:6px;padding:8px;margin:8px 0;align-items:center}.thumb{width:64px;height:64px;border:1px solid var(--yellow);border-radius:4px;background:#111;display:grid;place-items:center;font-size:34px;overflow:hidden}.thumb.lg{width:100%;height:134px;font-size:76px;background:radial-gradient(circle at 50% 30%,rgba(255,210,28,.25),transparent 35%),#090909;border-color:var(--hot)}.drink-name{font-family:var(--font-mono);font-size:15px;color:var(--cyan);line-height:1.12}.stars{letter-spacing:1px;color:var(--yellow);font-size:17px}.heart{font-size:24px;color:var(--hot);background:transparent;border:0;text-shadow:0 0 6px var(--hot)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.recent-list{font-family:var(--font-mono);font-size:11px;line-height:1.8}.counter{font-family:var(--font-mono);font-size:10px;color:#eee;text-align:right;margin-top:6px}.hr{border:0;border-top:1px dashed var(--hot);margin:12px 0}.pill{border:1px solid var(--yellow);color:var(--yellow);padding:4px 7px;border-radius:12px;font-family:var(--font-mono);font-size:10px;display:inline-flex;gap:5px;align-items:center;background:rgba(255,210,28,.08)}
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;border:1px solid #23375e;margin:10px 0}.detail-grid div{padding:5px;border-bottom:1px solid #1a2441;font-family:var(--font-mono);font-size:10px}.detail-grid div:nth-child(odd){color:var(--hot)}.ingredient-table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:12px}.ingredient-table td{padding:6px 2px;border-bottom:1px dotted #66205d}.ingredient-table td:last-child{text-align:right;color:#fff}.bartender-card{border:1px solid var(--hot);border-radius:8px;padding:14px;background:rgba(7,4,12,.94);box-shadow:0 0 12px rgba(255,58,166,.25);font-family:var(--font-mono)}.bartender-card h2{color:var(--cyan);font-size:30px;line-height:1.05;margin-bottom:14px}.bartender-card .ingredient-table{font-size:16px}.bartender-card h3{color:var(--hot);font-size:14px;margin-top:16px}.placeholder-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.placeholder{border:1px solid var(--hot);border-radius:5px;min-height:62px;padding:4px;text-align:center;background:#0a0810}.placeholder .icon{font-size:28px}.placeholder .label{font-family:var(--font-mono);font-size:9px;color:#eee;overflow:hidden;text-overflow:ellipsis}.upload-box{border:1px dashed var(--text);min-height:80px;display:grid;place-items:center;text-align:center;border-radius:6px;padding:8px}.loading{display:grid;place-items:center;text-align:center;min-height:360px}.hourglass{border:1px dashed var(--hot);padding:24px;font-size:54px;margin:24px auto;width:112px}.progress{height:24px;border:2px solid var(--hot);max-width:290px;margin:18px auto;background:#09050e}.bar{height:100%;background:linear-gradient(90deg,#ff3aa6,#8228ff);width:55%}.desktop{min-height:calc(100dvh - 20px);background:linear-gradient(rgba(0,232,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,58,166,.05) 1px,transparent 1px),radial-gradient(circle at 80% 25%,rgba(255,58,166,.18),transparent 35%),#030511;background-size:18px 18px,18px 18px,100% 100%;padding:22px;display:flex;flex-direction:column;justify-content:space-between}.desktop-icons{display:grid;gap:18px;width:90px}.desktop-icon{text-align:center;font-family:var(--font-mono);font-size:12px;color:#fff;text-shadow:1px 1px #000}.desktop-icon .big{font-size:34px}.taskbar{height:42px;background:#bdbdbd;border:2px outset #fff;display:flex;align-items:center;gap:8px;color:#111;padding:3px}.task-item{border:2px inset #fff;background:#8da5be;padding:6px 10px;font-family:var(--font-mono);font-size:11px;flex:1}.closed-center{text-align:center;margin-top:70px}.closed-center h1{font-family:var(--font-mono);color:var(--cyan);font-size:34px;line-height:1.25;text-shadow:2px 2px var(--hot)}
    .hidden{display:none!important}.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#111;border:1px solid var(--cyan);color:var(--cyan);padding:8px 12px;border-radius:4px;font-family:var(--font-mono);font-size:12px;box-shadow:0 0 12px rgba(0,232,255,.35);z-index:5}.draft-banner{border:1px solid var(--yellow);padding:8px;margin-bottom:10px;color:var(--yellow);background:rgba(255,210,28,.08);font-family:var(--font-mono);font-size:11px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:20;padding:18px}.modal-box{width:min(360px,100%);background:#0a0712;border:2px solid var(--hot);box-shadow:var(--shadow);padding:14px}.modal-box h3{font-family:var(--font-mono);color:var(--cyan);margin-bottom:8px}.modal-box .actions{grid-template-columns:1fr}.shake{animation:flicker .7s steps(2,end)}@keyframes flicker{0%,100%{opacity:1}40%{opacity:.7}55%{opacity:.92}70%{opacity:.75}}

    /* Pass 1.2: compact phone-height tuning so key screens feel less vertically stretched. */
    @media (max-width:520px){
      .app-wrap{padding:7px 5px 0}
      .browser{min-height:calc(100dvh - 8px)}
      .content{padding:10px 10px 66px}
      .content>h1{font-size:30px;line-height:1.05;margin-bottom:8px}
      .titlebar{height:26px}.toolbar{height:40px}.toolbtn{height:29px}.address{height:28px}
      .thumb.lg{height:104px;font-size:58px}
      .detail-grid{margin:8px 0}.detail-grid div{padding:4px 5px;font-size:9.5px}
      .section{padding:8px;margin:8px 0}.ingredient-table{font-size:11px}.ingredient-table td{padding:4px 2px}
      .actions{gap:8px;margin-top:8px}.retro-btn{padding:8px 10px}
    }
    @media (max-height:760px) and (max-width:520px){
      .content>h1{font-size:26px}
      .thumb.lg{height:86px;font-size:48px}
      .section-title{margin-bottom:4px}.small{font-size:10px}
      .ingredient-table td{padding:3px 2px}
    }


    /* Pass 1.3: global phone-density pass. The first versions were too roomy on actual phones, so this tightens the whole shell, nav, cards, forms, and key content blocks instead of only Drink Detail. */
    @media (max-width:520px){
      .app-wrap{padding:4px 3px 0}
      .browser{min-height:calc(100dvh - 4px)}
      .titlebar{height:22px;font-size:9.5px;gap:4px;padding:1px 4px;border-bottom-width:1px}
      .winbtn{width:20px;height:18px;font-size:11px;line-height:12px;border-width:2px}
      .toolbar{height:34px;gap:3px;padding:3px;border-bottom-width:1px}
      .toolbtn{width:27px;height:26px;font-size:15px}
      .address{height:24px;font-size:8px;padding:0 5px}
      .content{padding:7px 8px 58px}
      .statusbar{height:18px;bottom:42px;font-size:8.5px;padding:1px 5px}
      .bottomnav{height:42px}.navbtn{font-size:9px;padding:1px 0}.navbtn div:first-child{font-size:14px;line-height:14px}
      .logo{gap:8px;margin:0 0 8px}.logo-mark{font-size:34px}.logo-text{font-size:23px}.tagline{font-size:9px;margin-top:4px}
      .search-row{gap:5px}.search-row input{padding:6px}.retro-btn{padding:7px 9px;font-size:15px}.retro-btn.full{padding:8px 9px}
      .section{padding:7px;margin:7px 0}.section-title{font-size:12px;margin-bottom:5px}.small{font-size:10px}.counter{font-size:9px;margin-top:4px}.hr{margin:8px 0}
      .drink-card{grid-template-columns:56px 1fr 24px;gap:7px;padding:7px;margin:7px 0}.thumb{width:56px;height:56px;font-size:29px}.drink-name{font-size:14px}.stars{font-size:15px}.heart{font-size:21px}.recent-list{font-size:10px;line-height:1.55}
      .actions{gap:7px;margin-top:7px}.grid2{gap:7px}.row{gap:6px}.between{gap:6px}
      .field{margin:6px 0}.field label{font-size:10.5px;margin-bottom:3px}.field input,.field textarea,.field select{padding:6px}.field textarea{min-height:54px}
      .content>h1{font-size:25px;line-height:1.03;margin-bottom:7px}.thumb.lg{height:84px;font-size:46px}
      .detail-grid{margin:6px 0}.detail-grid div{padding:3px 4px;font-size:8.7px}.ingredient-table{font-size:10.5px}.ingredient-table td{padding:3px 2px}
      .bartender-card{padding:10px}.bartender-card h2{font-size:24px;margin-bottom:10px}.bartender-card .ingredient-table{font-size:13px}.bartender-card h3{font-size:12px;margin-top:11px}
      .placeholder-grid{grid-template-columns:repeat(4,1fr);gap:6px}.placeholder{min-height:52px;padding:3px}.placeholder .icon{font-size:22px}.placeholder .label{font-size:8px}
      .upload-box{min-height:64px;padding:6px}.loading{min-height:285px}.hourglass{font-size:42px;width:90px;padding:18px;margin:18px auto}.progress{height:20px;margin:14px auto}
      .draft-banner{padding:6px;margin-bottom:7px;font-size:10px}.pill{font-size:9px;padding:3px 6px}
      .closed-center{margin-top:45px}.closed-center h1{font-size:28px}.desktop{padding:16px}.desktop-icons{gap:14px}.taskbar{height:38px}.task-item{font-size:10px;padding:5px 8px}
    }
    @media (max-height:760px) and (max-width:520px){
      .content{padding-top:6px}.content>h1{font-size:23px}.logo-text{font-size:21px}.logo-mark{font-size:31px}
      .section{padding:6px;margin:6px 0}.drink-card{padding:6px;margin:6px 0}.thumb.lg{height:72px;font-size:40px}
      .retro-btn{padding:6px 8px}.field{margin:5px 0}.field input,.field textarea,.field select{padding:5px}.field textarea{min-height:48px}
      .ingredient-table td{padding:2.5px 2px}.bartender-card .ingredient-table{font-size:12px}
    }

    @media (min-width:760px){.app-wrap{width:430px}.content{min-height:640px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast hidden">Copied</div>
  <div id="modal" class="modal hidden"></div>
<script>
(() => {
  const STORAGE_KEY='bb_v04_pass1_drinks';
  const RECENT_KEY='bb_v04_recent';
  const DRAFT_KEY='bb_v04_draft';
  const sampleDrinks=[
    {id:'d1',name:'Spicy Pineapple Margarita',baseSpirit:'Tequila',ingredients:'Tequila\nPineapple Juice\nLime Juice\nAgave Syrup\nChili Slice',measurements:'2 oz\n1.5 oz\n0.75 oz\n0.5 oz\n2 slices',instructions:'Shake with ice. Strain over fresh ice.',garnish:'Pineapple wedge, Jalapeño slice',glass:'Rocks Glass',whereTried:'Neon Palms Bar, Tokyo',rating:4,notes:'Less sweet if possible. The chili really makes it.',favorite:true,recipeNeededLater:false,imageType:'placeholder',placeholderType:'color',placeholderId:'orange',flavor:'Fruity & Spicy',createdAt:Date.now()-300000,updatedAt:Date.now()-100000,lastOpenedAt:Date.now()-5000},
    {id:'d2',name:'Old Fashioned',baseSpirit:'Whiskey / Bourbon',ingredients:'Bourbon\nSimple Syrup\nAngostura Bitters\nOrange Peel',measurements:'2 oz\n0.25 oz\n2 dashes\n1',instructions:'Stir over ice and strain into a rocks glass.',garnish:'Orange peel',glass:'Rocks Glass',whereTried:'Home',rating:4,notes:'Classic.',favorite:false,recipeNeededLater:false,imageType:'placeholder',placeholderType:'spirit',placeholderId:'whiskey',flavor:'Classic',createdAt:Date.now()-200000,updatedAt:Date.now()-90000,lastOpenedAt:Date.now()-4000},
    {id:'d3',name:'Espresso Martini',baseSpirit:'Vodka',ingredients:'Vodka\nCoffee Liqueur\nEspresso\nSimple Syrup',measurements:'1.5 oz\n0.75 oz\n1 oz\n0.25 oz',instructions:'Shake hard with ice and strain into a coupe.',garnish:'Three coffee beans',glass:'Coupe',whereTried:'Moon Palms Bar',rating:4,notes:'Strong & smooth.',favorite:true,recipeNeededLater:false,imageType:'placeholder',placeholderType:'color',placeholderId:'brown',flavor:'Strong & Smooth',createdAt:Date.now()-100000,updatedAt:Date.now()-80000,lastOpenedAt:0}
  ];
  let state={screen:'home',previousScreen:'home',loading:null,selectedId:'d1',search:'',draft:null,fromScreen:'home',hasUnsaved:false};
  const $app=document.getElementById('app'), $toast=document.getElementById('toast'), $modal=document.getElementById('modal');
  const spirits=[['vodka','🍸','Vodka'],['gin','🥂','Gin'],['rum','🥃','Rum'],['tequila','🍹','Tequila'],['whiskey','🥃','Whiskey'],['scotch','🥃','Scotch'],['brandy','🍷','Brandy'],['mezcal','🔥','Mezcal'],['liqueur','🍾','Liqueur'],['coffee','☕','Coffee'],['nonalcoholic','🧃','Non-Alcoholic']];
  const colors=[['clear','⚪','Clear'],['yellow','🟡','Yellow'],['orange','🟠','Orange'],['red','🔴','Red'],['pink','💗','Pink'],['purple','🟣','Purple'],['blue','🔵','Blue'],['green','🟢','Green'],['amber','🟤','Amber'],['brown','🥃','Brown'],['creamy','🥛','Creamy']];
  function loadDrinks(){try{const raw=localStorage.getItem(STORAGE_KEY); if(raw) return JSON.parse(raw);}catch(e){} localStorage.setItem(STORAGE_KEY,JSON.stringify(sampleDrinks)); return sampleDrinks;}
  function saveDrinks(drinks){localStorage.setItem(STORAGE_KEY,JSON.stringify(drinks));}
  function drinks(){return loadDrinks();}
  function selected(){return drinks().find(d=>d.id===state.selectedId)||drinks()[0];}
  function setStatus(msg){state.status=msg||'Done';}
  function titleFor(screen){return ({home:'Saved Drinks',quick:'Quick Add',add:'Add Drink',detail:'Drink Detail',bartender:'Show Bartender',favorites:'Favorites',backup:'Backup & Export',placeholder:'Choose Placeholder',loading:'Loading...',minimized:'Minimized',closed:'Closed'})[screen]||'Saved Drinks';}
  function addressFor(screen){return 'https://bradleysboozebrowser.app/'+(screen==='home'?'':screen);}
  function navigate(to, opts={}){ if(state.hasUnsaved && !opts.skipUnsaved && ['home','favorites','backup','closed','minimized','detail'].includes(to)){ return unsavedDialog(()=>navigate(to,{...opts,skipUnsaved:true})); }
    const loadingNeeded=!opts.instant && to!=='loading'; if(loadingNeeded){const prev=state.screen; state.loading={target:to,message:opts.message||loadingMessage(to),prev}; state.previousScreen=prev; state.screen='loading'; render(); setTimeout(()=>{state.screen=to; state.loading=null; if(to==='detail') openSelected(state.selectedId,true); render();}, opts.delay||700);} else {state.screen=to; render();}}
  function loadingMessage(to){return ({quick:'Opening quick add...',add:'Opening recipe form...',detail:'Opening saved drink page...',bartender:'Loading bartender card...',favorites:'Opening favorites...',backup:'Opening backup...',placeholder:'Selecting placeholder...',home:'Returning home...',closed:'Closing app view...',minimized:'Minimizing app...'})[to]||'Loading recipe...';}
  function openSelected(id,silent){ state.selectedId=id; addRecent(id); if(!silent) navigate('detail',{message:'Opening saved drink page...'});}
  function addRecent(id){let list=[]; try{list=JSON.parse(localStorage.getItem(RECENT_KEY)||'[]')}catch(e){} list=[id,...list.filter(x=>x!==id)].slice(0,5); localStorage.setItem(RECENT_KEY,JSON.stringify(list)); const all=drinks().map(d=>d.id===id?{...d,lastOpenedAt:Date.now()}:d); saveDrinks(all);}
  function recentDrinks(){let ids=[]; try{ids=JSON.parse(localStorage.getItem(RECENT_KEY)||'[]')}catch(e){} const all=drinks(); return ids.map(id=>all.find(d=>d.id===id)).filter(Boolean).slice(0,5);}
  function stars(n){return '★★★★★☆☆☆☆☆'.slice(5-n,10-n).replace(/☆/g,'☆');}
  function ratingStars(n){let s=''; for(let i=1;i<=5;i++) s+=i<=Number(n||0)?'★':'☆'; return s;}
  function drinkThumb(d,large=false){ const found=[...spirits,...colors].find(p=>p[0]===d?.placeholderId); const icon=found?found[1]:(d?.baseSpirit||'').toLowerCase().includes('tequila')?'🍹':(d?.baseSpirit||'').toLowerCase().includes('coffee')?'☕':'🍸'; return `<div class="thumb ${large?'lg':''}">${icon}</div>`;}
  function card(d){return `<div class="drink-card"><button class="thumb" onclick="BB.open('${d.id}')">${drinkThumb(d).replace(/<[^>]+>/g,'')}</button><div><div class="drink-name">${esc(d.name)}</div><div class="small">${esc(d.flavor||d.notes||'Saved cocktail')}</div><div class="stars">${ratingStars(d.rating)}</div><div class="row"><button class="retro-btn blue" onclick="BB.open('${d.id}')">Open</button><button class="retro-btn" onclick="BB.bartender('${d.id}')">Bartender</button></div></div><button class="heart" onclick="BB.toggleFav('${d.id}')">${d.favorite?'♥':'♡'}</button></div>`;}
  function shell(content,active='saved'){ const backDisabled=state.screen==='home'; return `<div class="app-wrap"><div class="browser"><div class="titlebar"><span>🍸</span><span class="title">Bradley's BoozeBrowser — ${titleFor(state.screen)}</span><button class="winbtn" onclick="BB.minimize()">_</button><button class="winbtn" onclick="BB.maximize()">□</button><button class="winbtn" onclick="BB.close()">×</button></div><div class="toolbar"><button class="toolbtn ${backDisabled?'disabled':''}" onclick="BB.back()">←</button><button class="toolbtn disabled">→</button><button class="toolbtn" onclick="BB.goHome()">🏠</button><div class="address">${addressFor(state.screen)}</div><button class="toolbtn fav-star" onclick="BB.nav('favorites')"><span>★</span></button></div><main class="content ${state.screen==='loading'?'shake':''}">${content}</main><div class="statusbar"><span class="status-left">${state.status||'Done'}</span><span class="status-right">Cocktails archived: ${String(drinks().length).padStart(3,'0')}</span></div>${bottomnav(active)}</div></div>`;}
  function bottomnav(active){const items=[['home','🔍','Discover','home'],['saved','💾','Saved','home'],['add','➕','Add','add'],['backup','🧾','Backup','backup'],['profile','🙂','Profile','favorites']]; return `<nav class="bottomnav">${items.map(i=>`<button class="navbtn ${active===i[0]?'active':''}" onclick="BB.nav('${i[3]}')"><div>${i[1]}</div><span>${i[2]}</span></button>`).join('')}</nav>`;}
  function home(){ const all=drinks().filter(d=>d.name.toLowerCase().includes(state.search.toLowerCase())); const recent=recentDrinks(); const draft=localStorage.getItem(DRAFT_KEY); return shell(`${draft?`<div class="draft-banner">Recovered unsaved drink draft.<div class="actions"><button class="retro-btn" onclick="BB.continueDraft()">Continue Editing</button><button class="retro-btn grey" onclick="BB.deleteDraft()">Delete Draft</button></div></div>`:''}<div class="logo"><div class="logo-mark">🍸</div><div><div class="logo-text"><b>Bradley's</b><br>BoozeBrowser</div><div class="tagline">Your personal cocktail notebook.</div></div></div><div class="search-row"><input value="${esc(state.search)}" oninput="BB.search(this.value)" placeholder="Search your saved drinks..."/><button class="retro-btn">Search</button></div><div class="section"><div class="section-title">Recently opened:</div><div class="recent-list">${recent.length?recent.map(d=>`🍹 <button class="heart small" style="font-size:12px;color:white" onclick="BB.open('${d.id}')">${esc(d.name)}</button>`).join('<br>'):'No drinks opened yet.'}</div></div><div class="section-title">Saved Drinks (${all.length})</div>${all.map(card).join('')||'<div class="section">No saved drinks match that search.</div>'}<div class="actions"><button class="retro-btn" onclick="BB.nav('add')">＋ Add Drink</button><button class="retro-btn" onclick="BB.nav('quick')">⚡ Quick Add</button></div><div class="counter">Cocktails archived: ${String(drinks().length).padStart(3,'0')}</div>`,'saved');}
  function quick(){ return shell(`<h1 class="cyan mono">Quick Add <span class="hot" style="float:right">ϟ</span></h1><p class="small">Save the memory now. Fill in the recipe later.</p><form oninput="BB.markUnsaved()" onsubmit="BB.saveQuick(event)"><div class="field"><label>Drink Name</label><input name="name" required placeholder="e.g. Jungle Bird"></div><div class="field"><label>Where I Tried It</label><input name="whereTried" placeholder="e.g. Neon Palms Bar, Tokyo"></div><div class="field"><label>Rating</label><select name="rating"><option value="5">★★★★★</option><option value="4" selected>★★★★☆</option><option value="3">★★★☆☆</option><option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option></select></div><div class="field"><label>Quick Note</label><textarea name="notes" placeholder="e.g. Super refreshing. Less sweet if possible."></textarea></div><div class="section between"><span class="cyan mono">Recipe needed later</span><input name="recipeNeededLater" type="checkbox" checked></div><div class="section"><div class="section-title">Image</div><div class="grid2"><button type="button" class="upload-box" onclick="BB.toast('Image upload comes in Pass 2')">📷<br>Add Photo</button><button type="button" class="upload-box" onclick="BB.nav('placeholder')">🍸<br>Choose Placeholder</button></div></div><button class="retro-btn pink full">Save Quick Add</button><button type="button" class="retro-btn full" style="margin-top:9px" onclick="BB.nav('add')">Full Add Mode</button></form>`,'add');}
  function add(){ const d=state.draft||{}; return shell(`<h1 class="hot mono">Add a New Drink <span style="float:right">🍹</span></h1><form oninput="BB.saveDraftFromForm(this)" onsubmit="BB.saveFull(event)">${field('Drink Name','name',d.name,'e.g. Spicy Pineapple Margarita',true)}${field('Base Spirit','baseSpirit',d.baseSpirit,'e.g. Tequila')}<div class="field"><label>Ingredients</label><textarea name="ingredients" placeholder="List ingredients...">${esc(d.ingredients||'')}</textarea></div><div class="field"><label>Measurements</label><textarea name="measurements" placeholder="List measurements...">${esc(d.measurements||'')}</textarea></div><div class="field"><label>Instructions</label><textarea name="instructions" placeholder="How to make it...">${esc(d.instructions||'')}</textarea></div>${field('Garnish','garnish',d.garnish,'e.g. Pineapple wedge')}${field('Glass','glass',d.glass,'e.g. Rocks Glass')}${field('Where I Tried It','whereTried',d.whereTried,'e.g. Neon Palms Bar')}<div class="field"><label>Rating</label><select name="rating">${[5,4,3,2,1,0].map(n=>`<option value="${n}" ${Number(d.rating||4)===n?'selected':''}>${ratingStars(n)}</option>`).join('')}</select></div><div class="field"><label>Notes</label><textarea name="notes" placeholder="Any notes about this drink...">${esc(d.notes||'')}</textarea></div><div class="section"><label><input type="checkbox" name="favorite" ${d.favorite?'checked':''}> <span class="hot mono">Add to favorites</span></label></div><div class="section"><div class="section-title">Image (one image per drink)</div><div class="grid2"><button type="button" class="upload-box" onclick="BB.toast('Delete/replace/upload comes in Pass 2')">🍸<br>Current Placeholder</button><button type="button" class="retro-btn" onclick="BB.nav('placeholder')">Choose Placeholder</button></div><p class="small">No drink image added yet. Add Photo, Choose Placeholder, or Skip for now.</p></div><div class="actions"><button class="retro-btn pink">💾 Save Drink</button><button type="button" class="retro-btn grey" onclick="BB.cancelEdit()">Cancel</button></div></form>`,'add');}
  function field(label,name,val='',ph='',req=false){return `<div class="field"><label>${label}</label><input name="${name}" value="${esc(val||'')}" placeholder="${ph}" ${req?'required':''}></div>`;}
  function detail(){ const d=selected(); return shell(`<h1 class="cyan mono">${esc(d.name)}</h1>${drinkThumb(d,true)}<div class="between"><div><span class="hot">♥</span> <span class="small">${esc(d.flavor||d.notes||'Saved cocktail')}</span></div><div class="stars">${ratingStars(d.rating)}</div></div><div class="detail-grid"><div>Base Spirit</div><div>${esc(d.baseSpirit||'—')}</div><div>Glass</div><div>${esc(d.glass||'—')}</div><div>Where I Tried It</div><div>${esc(d.whereTried||'—')}</div><div>Garnish</div><div>${esc(d.garnish||'—')}</div></div><div class="section"><div class="section-title">Ingredients</div>${ingredientTable(d)}</div><div class="section"><div class="section-title">Notes</div><div class="small">${esc(d.notes||'No notes yet.')}</div></div>${d.recipeNeededLater?'<div class="pill">⚠ Recipe incomplete</div>':''}<div class="actions"><button class="retro-btn blue" onclick="BB.nav('bartender')">👨‍🍳 Show Bartender</button><button class="retro-btn" onclick="BB.editSelected()">Edit Drink</button></div>`,'saved');}
  function ingredientTable(d){ const ing=(d.ingredients||'').split('\n').filter(Boolean), meas=(d.measurements||'').split('\n'); if(!ing.length) return '<p class="small">No ingredients saved yet.</p>'; return `<table class="ingredient-table">${ing.map((x,i)=>`<tr><td>${esc(x)}</td><td>${esc(meas[i]||'')}</td></tr>`).join('')}</table>`;}
  function bartender(){ const d=selected(); const recipe=[d.name,'',...(d.ingredients||'').split('\n').map((x,i)=>`${x} ${(d.measurements||'').split('\n')[i]||''}`),'',d.garnish?`Garnish: ${d.garnish}`:'',d.glass?`Glass: ${d.glass}`:'',d.notes?`Note: ${d.notes}`:''].filter(Boolean).join('\n'); return shell(`<div class="bartender-card"><h2>${esc(d.name)}</h2><div class="small" style="font-size:14px;margin-bottom:10px"><span class="hot">♥</span> ${esc(d.flavor||'Cocktail recipe')}</div><h3>INGREDIENTS</h3>${ingredientTable(d)}<h3>GARNISH</h3><p>${esc(d.garnish||'—')}</p><h3>GLASS</h3><p>${esc(d.glass||'—')}</p><h3>NOTE TO BARTENDER</h3><p>${esc(d.notes||'')}</p>${d.instructions?`<h3>INSTRUCTIONS</h3><p>${esc(d.instructions)}</p>`:''}</div><div class="actions"><button class="retro-btn grey" onclick="BB.nav('detail')">← Back</button><button class="retro-btn pink" onclick="BB.copyRecipe(${JSON.stringify(recipe)})">💾 Copy Recipe</button></div><button class="retro-btn full" style="margin-top:9px" onclick="BB.toast('Drink photo view comes in Pass 2')">Show Drink Photo</button>`,'saved');}
  function favorites(){ const favs=drinks().filter(d=>d.favorite); return shell(`<h1 class="hot mono">★ Favorites</h1><p class="small">Bookmarked Cocktails</p>${favs.length?favs.map(card).join(''):`<div class="section" style="text-align:center;padding:28px"><div style="font-size:44px">⭐</div><p>No favorite drinks yet.<br>Tap the heart on any saved drink to bookmark it.</p><button class="retro-btn" onclick="BB.nav('home')">Return to Saved Drinks</button></div>`}`,'profile');}
  function backup(){ return shell(`<h1 class="cyan mono">💾 Backup & Export</h1><p class="small">Your drinks are saved locally in this browser. Export a backup so you do not lose them.</p><div class="section between"><div><div class="section-title">Export as Text</div><div class="small">Plain text file. Easy to read and share.</div></div><button class="retro-btn" onclick="BB.exportText()">Export TXT</button></div><div class="section between"><div><div class="section-title">Export as JSON Backup</div><div class="small">All recipe data, notes, ratings, and favorites.</div></div><button class="retro-btn" onclick="BB.exportJSON()">Export JSON</button></div><div class="section between"><div><div class="section-title">Export Full Backup (with photos)</div><div class="small">Photo ZIP backup is scaffolded for a later pass.</div></div><button class="retro-btn" onclick="BB.toast('Full ZIP backup comes in Pass 2/3')">Export ZIP</button></div>`,'backup');}
  function placeholderScreen(){ return shell(`<h1 class="hot mono">Choose a Placeholder</h1><div class="section-title">BY SPIRIT CATEGORY</div><div class="placeholder-grid">${spirits.map(p=>placeBtn(p,'spirit')).join('')}</div><div class="hr"></div><div class="section-title">BY COLOR</div><div class="placeholder-grid">${colors.map(p=>placeBtn(p,'color')).join('')}</div>`,'add');}
  function placeBtn(p,type){return `<button class="placeholder" onclick="BB.pickPlaceholder('${type}','${p[0]}')"><div class="icon">${p[1]}</div><div class="label">${p[2]}</div></button>`;}
  function loading(){ const l=state.loading||{}; return shell(`<div class="loading"><div><h1 class="cyan mono">Loading recipe...</h1><div class="hourglass">⌛</div><p class="mono">${esc(l.message||'Opening saved drink page...')}</p><div class="progress"><div class="bar"></div></div><span class="mono">55%</span></div></div>`,'saved');}
  function minimized(){ return `<div class="desktop"><div class="desktop-icons"><button class="desktop-icon" onclick="BB.nav('home')"><div class="big">🍸</div>My Drinks</button><button class="desktop-icon" onclick="BB.nav('backup')"><div class="big">💾</div>Backup</button><div class="desktop-icon"><div class="big">🗑️</div>Trash</div></div><div style="text-align:center;color:var(--hot);font-size:32px;font-family:var(--font-mono);text-shadow:0 0 10px var(--hot)">COCKTAILS<br><span style="font-size:64px">🍸</span><br><span style="font-size:14px;color:#111;background:#ff7cc5;padding:10px;display:inline-block;transform:rotate(-5deg)">Save it now.<br>Sip it later.</span></div><div class="taskbar"><button class="toolbtn" onclick="BB.reopen()">Start</button><button class="task-item" onclick="BB.reopen()">🍸 Bradley's BoozeBrowser</button><div>🔊 9:41 PM</div></div></div>`;}
  function closed(){ return `<div class="app-wrap"><div class="browser"><div class="titlebar"><span>🍸</span><span class="title">Bradley's BoozeBrowser — Closed</span><button class="winbtn">_</button><button class="winbtn">□</button><button class="winbtn" onclick="BB.reopen()">×</button></div><main class="content"><div class="closed-center"><h1>Bradley's<br>BoozeBrowser<br>is closed.</h1><div style="font-size:64px">🍸</div><p class="small">Your saved drinks are still here.</p><button class="retro-btn pink" style="font-size:18px" onclick="BB.reopen()">Reopen BoozeBrowser</button></div></main><div class="statusbar" style="bottom:0"><span class="status-left">Session ended.</span><span>🔊 9:41 PM</span></div></div></div>`;}
  function render(){ const screen=state.screen; const map={home,quick,add,detail,bartender,favorites,backup,placeholder:placeholderScreen,loading,minimized,closed}; $app.innerHTML=(map[screen]||home)(); }
  function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  function formObj(form){return Object.fromEntries(new FormData(form).entries());}
  function download(name,text,type='text/plain'){const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),500);}
  function toast(msg){$toast.textContent=msg;$toast.classList.remove('hidden');setTimeout(()=>$toast.classList.add('hidden'),1500)}
  function unsavedDialog(cb){$modal.innerHTML=`<div class="modal-box"><h3>Unsaved cocktail data detected.</h3><p>Save this drink before leaving?</p><div class="actions"><button class="retro-btn pink" onclick="BB.saveDraftThenContinue()">Save Drink</button><button class="retro-btn grey" onclick="BB.discardThenContinue()">Discard</button><button class="retro-btn" onclick="BB.keepEditing()">Keep Editing</button></div></div>`;$modal.classList.remove('hidden');state.pendingNav=cb;}
  function hideModal(){$modal.classList.add('hidden');$modal.innerHTML='';}
  window.BB={
    nav:to=>navigate(to), open:id=>openSelected(id), bartender:id=>{state.selectedId=id; addRecent(id); navigate('bartender')},
    back:()=>{ if(state.screen==='home')return; navigate(state.previousScreen==='loading'?'home':state.previousScreen||'home');},
    goHome:()=>navigate('home',{message:'Reloading home page...'}), minimize:()=>navigate('minimized',{message:'Minimizing app...'}), maximize:()=>toast('Full browser mode comes in a later polish pass.'),
    close:()=>{ if(state.hasUnsaved) return unsavedDialog(()=>navigate('closed',{skipUnsaved:true})); $modal.innerHTML=`<div class="modal-box"><h3>Close Bradley’s BoozeBrowser?</h3><p>Your drinks are saved locally in this browser.</p><div class="actions"><button class="retro-btn pink" onclick="BB.confirmClose()">Close App View</button><button class="retro-btn grey" onclick="BB.keepEditing()">Cancel</button></div></div>`;$modal.classList.remove('hidden');},
    confirmClose:()=>{hideModal();navigate('closed',{skipUnsaved:true,message:'Closing app view...'})}, reopen:()=>navigate('home',{message:'Reopening BoozeBrowser...'}), search:v=>{state.search=v; render()},
    toggleFav:id=>{const all=drinks().map(d=>d.id===id?{...d,favorite:!d.favorite,updatedAt:Date.now()}:d);saveDrinks(all);render()},
    copyRecipe:t=>navigator.clipboard?.writeText(t).then(()=>toast('Recipe copied')).catch(()=>toast('Copy blocked by browser')),
    toast, markUnsaved:()=>{state.hasUnsaved=true;},
    saveQuick:e=>{e.preventDefault(); const o=formObj(e.target); const d={id:'d'+Date.now(),name:o.name,baseSpirit:'',ingredients:'',measurements:'',instructions:'',garnish:'',glass:'',whereTried:o.whereTried,rating:Number(o.rating),notes:o.notes,favorite:false,recipeNeededLater:!!o.recipeNeededLater,imageType:'placeholder',placeholderType:'generic',placeholderId:'generic',flavor:'Recipe incomplete',createdAt:Date.now(),updatedAt:Date.now(),lastOpenedAt:0}; saveDrinks([d,...drinks()]); state.hasUnsaved=false; state.selectedId=d.id; toast('Quick Add saved'); navigate('detail',{skipUnsaved:true});},
    saveDraftFromForm:form=>{state.hasUnsaved=true; const o=formObj(form); o.favorite=!!form.favorite?.checked; state.draft=o; localStorage.setItem(DRAFT_KEY,JSON.stringify(o));},
    saveFull:e=>{e.preventDefault(); const o=formObj(e.target); const d={id:'d'+Date.now(),name:o.name,baseSpirit:o.baseSpirit,ingredients:o.ingredients,measurements:o.measurements,instructions:o.instructions,garnish:o.garnish,glass:o.glass,whereTried:o.whereTried,rating:Number(o.rating),notes:o.notes,favorite:!!e.target.favorite?.checked,recipeNeededLater:false,imageType:'placeholder',placeholderType:'generic',placeholderId:'generic',flavor:o.notes?.split('.')[0]||'Saved cocktail',createdAt:Date.now(),updatedAt:Date.now(),lastOpenedAt:0}; saveDrinks([d,...drinks()]); localStorage.removeItem(DRAFT_KEY); state.draft=null; state.hasUnsaved=false; state.selectedId=d.id; toast('Drink saved'); navigate('detail',{skipUnsaved:true});},
    cancelEdit:()=>{state.hasUnsaved=false; localStorage.removeItem(DRAFT_KEY); state.draft=null; navigate('home',{skipUnsaved:true});},
    continueDraft:()=>{try{state.draft=JSON.parse(localStorage.getItem(DRAFT_KEY)||'{}')}catch(e){} navigate('add',{skipUnsaved:true});}, deleteDraft:()=>{localStorage.removeItem(DRAFT_KEY);state.draft=null;state.hasUnsaved=false;render()},
    editSelected:()=>{const d=selected(); state.draft=d; localStorage.setItem(DRAFT_KEY,JSON.stringify(d)); navigate('add')},
    pickPlaceholder:(type,id)=>{state.placeholder={type,id};toast('Placeholder selected'); navigate(state.draft?'add':'home',{skipUnsaved:true});},
    exportText:()=>{const text=drinks().map(d=>`${d.name}\nRating: ${ratingStars(d.rating)}\nBase: ${d.baseSpirit||''}\nGlass: ${d.glass||''}\nGarnish: ${d.garnish||''}\nWhere: ${d.whereTried||''}\n\nIngredients:\n${d.ingredients||''}\n\nMeasurements:\n${d.measurements||''}\n\nInstructions:\n${d.instructions||''}\n\nNotes:\n${d.notes||''}\n\n---`).join('\n\n');download('bradleys-boozebrowser-backup.txt',text);toast('Download complete: backup.txt')},
    exportJSON:()=>{download('bradleys-boozebrowser-backup.json',JSON.stringify({version:'v0.4-pass1',exportedAt:new Date().toISOString(),drinks:drinks()},null,2),'application/json');toast('Download complete: backup.json')},
    saveDraftThenContinue:()=>{hideModal(); state.hasUnsaved=false; state.pendingNav?.();}, discardThenContinue:()=>{hideModal(); state.hasUnsaved=false; localStorage.removeItem(DRAFT_KEY); state.draft=null; state.pendingNav?.();}, keepEditing:()=>{hideModal();}
  };
  setStatus('Done'); render();
})();
</script>
</body>
</html>
