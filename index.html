(() => {
  const STORAGE_KEY='bb_v04_pass1_drinks';
  const RECENT_KEY='bb_v04_recent';
  const DRAFT_KEY='bb_v04_draft';
  const sampleDrinks=[
    {id:'d1',name:'Spicy Pineapple Margarita',baseSpirit:'Tequila',ingredients:'Tequila\nPineapple Juice\nLime Juice\nAgave Syrup\nChili Slice',measurements:'2 oz\n1.5 oz\n0.75 oz\n0.5 oz\n2 slices',instructions:'Shake with ice. Strain over fresh ice.',garnish:'Pineapple wedge, Jalapeño slice',glass:'Rocks Glass',whereTried:'Neon Palms Bar, Tokyo',rating:4,notes:'Less sweet if possible. The chili really makes it.',favorite:true,recipeNeededLater:false,imageType:'placeholder',placeholderType:'color',placeholderId:'orange',flavor:'Fruity & Spicy',createdAt:Date.now()-300000,updatedAt:Date.now()-100000,lastOpenedAt:Date.now()-5000},
    {id:'d2',name:'Old Fashioned',baseSpirit:'Whiskey / Bourbon',ingredients:'Bourbon\nSimple Syrup\nAngostura Bitters\nOrange Peel',measurements:'2 oz\n0.25 oz\n2 dashes\n1',instructions:'Stir over ice and strain into a rocks glass.',garnish:'Orange peel',glass:'Rocks Glass',whereTried:'Home',rating:4,notes:'Classic.',favorite:false,recipeNeededLater:false,imageType:'placeholder',placeholderType:'spirit',placeholderId:'whiskey',flavor:'Classic',createdAt:Date.now()-200000,updatedAt:Date.now()-90000,lastOpenedAt:Date.now()-4000},
    {id:'d3',name:'Espresso Martini',baseSpirit:'Vodka',ingredients:'Vodka\nCoffee Liqueur\nEspresso\nSimple Syrup',measurements:'1.5 oz\n0.75 oz\n1 oz\n0.25 oz',instructions:'Shake hard with ice and strain into a coupe.',garnish:'Three coffee beans',glass:'Coupe',whereTried:'Moon Palms Bar',rating:4,notes:'Strong & smooth.',favorite:true,recipeNeededLater:false,imageType:'placeholder',placeholderType:'color',placeholderId:'brown',flavor:'Strong & Smooth',createdAt:Date.now()-100000,updatedAt:Date.now()-80000,lastOpenedAt:0}
  ];
  let state={screen:'home',previousScreen:'home',history:[],loading:null,selectedId:'d1',search:'',draft:null,fromScreen:'home',hasUnsaved:false};
  const $app=document.getElementById('app'), $toast=document.getElementById('toast'), $modal=document.getElementById('modal');
  const spirits=[['vodka','🍸','Vodka'],['gin','🥂','Gin'],['rum','🥃','Rum'],['tequila','🍹','Tequila'],['whiskey','🥃','Whiskey'],['scotch','🥃','Scotch'],['brandy','🍷','Brandy'],['mezcal','🔥','Mezcal'],['liqueur','🍾','Liqueur'],['coffee','☕','Coffee'],['nonalcoholic','🧃','Non-Alcoholic']];
  const colors=[['clear','⚪','Clear'],['yellow','🟡','Yellow'],['orange','🟠','Orange'],['red','🔴','Red'],['pink','💗','Pink'],['purple','🟣','Purple'],['blue','🔵','Blue'],['green','🟢','Green'],['amber','🟤','Amber'],['brown','🥃','Brown'],['creamy','🥛','Creamy']];
  function normalizeDrink(d){
    if(!d || typeof d!=='object') return d;
    const n={...d};
    if(n.flavor==='Recipe incomplete') n.flavor='Recipe Incomplete';
    return n;
  }
  function loadDrinks(){
    try{
      const raw=localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed=JSON.parse(raw);
        if(Array.isArray(parsed)){
          const normalized=parsed.map(normalizeDrink);
          if(JSON.stringify(parsed)!==JSON.stringify(normalized)) localStorage.setItem(STORAGE_KEY,JSON.stringify(normalized));
          return normalized;
        }
        return parsed;
      }
    }catch(e){}
    const initial=sampleDrinks.map(normalizeDrink);
    localStorage.setItem(STORAGE_KEY,JSON.stringify(initial));
    return initial;
  }
  function saveDrinks(drinks){localStorage.setItem(STORAGE_KEY,JSON.stringify((drinks||[]).map(normalizeDrink)));}
  function drinks(){return loadDrinks();}
  function selected(){return drinks().find(d=>d.id===state.selectedId)||drinks()[0];}
  const BUILD_LABEL='Build v0.4.2.5.1';
  function setStatus(msg){state.status=msg||BUILD_LABEL;}
  function titleFor(screen){ if(screen==='add' && state.draft?.id) return 'Edit Drink'; return ({home:'Saved Drinks',discover:'Discover',quick:'Quick Add',add:'Add Drink',detail:'Drink Detail',bartender:'Show Bartender',favorites:'Favorites',backup:'Backup & Export',placeholder:'Choose Placeholder',loading:'Loading...',minimized:'Minimized',closed:'Closed'})[screen]||'Saved Drinks';}
  function addressFor(screen){ const path=(screen==='add' && state.draft?.id)?'edit':(screen==='home'?'':screen); return 'https://bradleysboozebrowser.app/'+path;}
  function navigate(to, opts={}){ if(state.hasUnsaved && !opts.skipUnsaved && to!==state.screen && to!=='loading'){ return unsavedDialog(()=>navigate(to,{...opts,skipUnsaved:true})); }
    const from=state.screen==='loading'?(state.loading?.prev||state.previousScreen||'home'):state.screen;
    if(!opts.skipHistory && from && from!==to && from!=='loading') state.history.push(from);
    if(to==='home' && opts.clearHistory) state.history=[];
    const loadingNeeded=!opts.instant && to!=='loading';
    if(loadingNeeded){state.loading={target:to,message:opts.message||loadingMessage(to),prev:from}; state.previousScreen=state.history[state.history.length-1]||'home'; state.screen='loading'; render(); setTimeout(()=>{state.screen=to; state.loading=null; if(to==='detail') openSelected(state.selectedId,true); render();}, opts.delay||700);} else {state.screen=to; state.previousScreen=state.history[state.history.length-1]||'home'; render();}}
  function loadingMessage(to){return ({discover:'Opening Discover...',quick:'Opening quick add...',add:'Opening recipe form...',detail:'Opening saved drink page...',bartender:'Loading bartender card...',favorites:'Opening favorites...',backup:'Opening backup...',placeholder:'Selecting placeholder...',home:'Returning home...',closed:'Closing app view...',minimized:'Minimizing app...'})[to]||'Loading recipe...';}
  function openSelected(id,silent){ state.selectedId=id; addRecent(id); if(!silent) navigate('detail',{message:'Opening saved drink page...'});}
  function addRecent(id){let list=[]; try{list=JSON.parse(localStorage.getItem(RECENT_KEY)||'[]')}catch(e){} list=[id,...list.filter(x=>x!==id)].slice(0,3); localStorage.setItem(RECENT_KEY,JSON.stringify(list)); const all=drinks().map(d=>d.id===id?{...d,lastOpenedAt:Date.now()}:d); saveDrinks(all);}
  function recentDrinks(){let ids=[]; try{ids=JSON.parse(localStorage.getItem(RECENT_KEY)||'[]')}catch(e){} const all=drinks(); return ids.map(id=>all.find(d=>d.id===id)).filter(Boolean).slice(0,3);}
  function stars(n){return '★★★★★☆☆☆☆☆'.slice(5-n,10-n).replace(/☆/g,'☆');}
  function ratingStars(n){let s=''; for(let i=1;i<=5;i++) s+=i<=Number(n||0)?'★':'☆'; return s;}
  function placeholderMeta(d={}){
    const found=[...spirits,...colors].find(p=>p[0]===d?.placeholderId);
    const icon=found?found[1]:(d?.baseSpirit||'').toLowerCase().includes('tequila')?'🍹':(d?.baseSpirit||'').toLowerCase().includes('coffee')?'☕':'🍸';
    const label=found?found[2]:(d?.placeholderId&&d.placeholderId!=='generic'?d.placeholderId:'Generic Cocktail');
    const type=d?.placeholderType==='spirit'?'Spirit placeholder':d?.placeholderType==='color'?'Color placeholder':'Default placeholder';
    return {icon,label,type};
  }
  function drinkThumb(d,large=false){ const meta=placeholderMeta(d); return `<div class="thumb ${large?'lg':''}">${meta.icon}</div>`;}
  function imagePreview(d={}, opts={}){
    const meta=placeholderMeta(d);
    const hasSelected=!!(d && d.placeholderId && d.placeholderId!=='generic');
    return `<div class="image-preview-card"><div class="preview-icon">${meta.icon}</div><div><div class="preview-title">${opts.title||'Current drink image'}</div><div class="preview-label">${esc(meta.label)}</div><div class="small">${hasSelected?meta.type:'No custom image selected yet. Using the generic fallback for now.'}</div></div></div>`;
  }
  function noImagePrompt(){return `<div class="no-image-prompt"><div class="section-title">No drink image added yet.</div><div class="small">Use a placeholder for now, or skip and keep the generic cocktail icon. Real photo upload is saved for a later 2.x update.</div><div class="image-actions"><button type="button" class="retro-btn" onclick="BB.choosePlaceholder()">Choose Placeholder</button><button type="button" class="retro-btn grey" onclick="BB.skipImagePrompt()">Skip for now</button></div></div>`;}
  function draftSummaryHTML(){
    try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'{}'); if(!d||!Object.keys(d).length) return ''; const type=d.mode==='quick'?'Quick Add':'Full Add'; const name=d.name?`: <span class="draft-name">${esc(d.name)}</span>`:''; return `<div class="draft-banner">Recovered unsaved ${type} draft${name}.<div class="actions"><button class="retro-btn" onclick="BB.continueDraft()">Continue Editing</button><button class="retro-btn grey" onclick="BB.deleteDraft()">Delete Draft</button></div></div>`;}catch(e){return '';}
  }
  function isIncomplete(d={}){
    return !!(d?.recipeNeededLater || d?.recipeIncomplete);
  }
  function recipeBadgeHTML(d){
    return isIncomplete(d)?'<div class="incomplete-badge">⚠ Recipe Incomplete</div>':'';
  }
  function incompleteDrinks(){
    return drinks().filter(isIncomplete);
  }
  function finishListHTML(){
    const list=incompleteDrinks();
    return `<div class="section"><div class="section-title">Recipes to Finish (${list.length})</div>${list.length?list.map(d=>`<div class="finish-card"><div><div class="drink-name">${esc(d.name)}</div><div class="small">${esc(d.whereTried||d.notes||'Saved from Quick Add')}</div>${recipeBadgeHTML(d)}</div><button class="retro-btn" onclick="BB.finishRecipe('${d.id}')">Finish</button></div>`).join(''):'<p class="small">No unfinished recipes right now. Future “what should I try next?” tools will live here later.</p>'}</div>`;
  }
  function card(d){return `<div class="drink-card"><button class="thumb" onclick="BB.open('${d.id}')">${drinkThumb(d).replace(/<[^>]+>/g,'')}</button><div><div class="drink-name">${esc(d.name)}</div><div class="small">${esc(d.flavor||d.notes||'Saved cocktail')}</div>${recipeBadgeHTML(d)}<div class="stars">${ratingStars(d.rating)}</div><div class="row"><button class="retro-btn blue" onclick="BB.open('${d.id}')">Open</button><button class="retro-btn" onclick="BB.bartender('${d.id}')">Bartender</button></div></div><button class="heart" onclick="BB.toggleFav('${d.id}')">${d.favorite?'♥':'♡'}</button></div>`;}
  function shell(content,active='saved',footer=''){ const backDisabled=state.screen==='home'; return `<div class="app-wrap"><div class="browser"><div class="titlebar"><span>🍸</span><span class="title">Bradley's BoozeBrowser — ${titleFor(state.screen)}</span><button class="winbtn" onclick="BB.minimize()">_</button><button class="winbtn" onclick="BB.maximize()">□</button><button class="winbtn" onclick="BB.close()">×</button></div><div class="toolbar"><button class="toolbtn ${backDisabled?'disabled':''}" onclick="BB.back()">←</button><button class="toolbtn disabled">→</button><button class="toolbtn" onclick="BB.goHome()">🏠</button><div class="address">${addressFor(state.screen)}</div><button class="toolbtn fav-star" onclick="BB.nav('favorites')"><span>★</span></button></div><main class="content screen-${state.screen} ${state.screen==='loading'?'shake':''}">${content}</main>${footer?`<div class="screen-footer">${footer}</div>`:''}<div class="statusbar"><span class="status-left">${state.status||BUILD_LABEL}</span><span class="status-right">Cocktails archived: ${String(drinks().length).padStart(3,'0')}</span></div>${bottomnav(active)}</div></div>`;}
  function bottomnav(active){const items=[['discover','🔍','Discover','discover'],['saved','💾','Saved','home'],['add','➕','Add','add'],['backup','🧾','Backup','backup'],['favorites','💗','Favorites','favorites']]; return `<nav class="bottomnav">${items.map(i=>`<button class="navbtn ${active===i[0]?'active':''}" onclick="BB.nav('${i[3]}')"><div>${i[1]}</div><span>${i[2]}</span></button>`).join('')}</nav>`;}
  function homeListHTML(){ const all=drinks().filter(d=>d.name.toLowerCase().includes(state.search.toLowerCase())); const recent=recentDrinks(); return `<div class="section"><div class="section-title">Recently Opened:</div><div class="recent-list">${recent.length?recent.map(d=>`🍹 <button class="heart small" style="font-size:12px;color:white" onclick="BB.open('${d.id}')">${esc(d.name)}</button>`).join('<br>'):'No drinks opened yet.'}</div></div><div class="section-title">Saved Drinks (${all.length})</div>${all.map(card).join('')||'<div class="section">No saved drinks match that search.</div>'}`;}
  function home(){ const draft=localStorage.getItem(DRAFT_KEY); const footer=`<div class="actions"><button class="retro-btn" onclick="BB.nav('add')">＋ Add Drink</button><button class="retro-btn" onclick="BB.nav('quick')">⚡ Quick Add</button></div>`; return shell(`<div class="home-static">${draftSummaryHTML()}<div class="logo"><div class="logo-mark">🍸</div><div><div class="logo-text"><b>Bradley's</b><br>BoozeBrowser</div><div class="tagline">Your personal cocktail notebook.</div></div></div><div class="search-row"><input id="drinkSearch" value="${esc(state.search)}" oninput="BB.search(this.value)" placeholder="Search your saved drinks..." autocomplete="off" autocapitalize="off" spellcheck="false"/><button id="clearSearchBtn" class="retro-btn grey" type="button" onclick="BB.clearSearch()" style="display:${state.search?'inline-block':'none'}">Clear</button></div></div><div class="home-scroll">${homeListHTML()}</div>`,'saved',footer);}
  function quick(){ const d=state.draft?.mode==='quick'?state.draft:{}; const ph=state.placeholder||((d.placeholderId&&d.placeholderType)?{type:d.placeholderType,id:d.placeholderId}:null); return shell(`<h1 class="cyan mono">Quick Add <span class="hot" style="float:right">ϟ</span></h1><p class="small">Save the memory now. Fill in the recipe later.</p><form data-drink-form="quick" oninput="BB.saveQuickDraftFromForm(this)" onsubmit="BB.saveQuick(event)"><div class="field"><label>Drink Name</label><input name="name" required placeholder="e.g. Jungle Bird" value="${esc(d.name||'')}"></div><div class="field"><label>Where I Tried It</label><input name="whereTried" placeholder="e.g. Neon Palms Bar, Tokyo" value="${esc(d.whereTried||'')}"></div><div class="field"><label>Rating</label><select name="rating">${[5,4,3,2,1,0].map(n=>`<option value="${n}" ${Number(d.rating||4)===n?'selected':''}>${ratingStars(n)}</option>`).join('')}</select></div><div class="field"><label>Quick Note</label><textarea name="notes" placeholder="e.g. Super refreshing. Less sweet if possible.">${esc(d.notes||'')}</textarea></div><div class="section between"><span class="cyan mono">Recipe needed later</span><input name="recipeNeededLater" type="checkbox" ${d.recipeNeededLater===false?'':'checked'}></div><div class="section"><div class="section-title">Drink Image / Placeholder</div>${imagePreview({placeholderId:ph?.id||d.placeholderId||'generic',placeholderType:ph?.type||d.placeholderType||'generic'}, {title: ph||d.placeholderId?'Selected placeholder':'Current placeholder'})}${!(ph||d.placeholderId)?noImagePrompt():`<div class="image-actions"><button type="button" class="retro-btn" onclick="BB.choosePlaceholder()">Change Placeholder</button><button type="button" class="retro-btn grey" onclick="BB.skipImagePrompt()">Skip for now</button></div>`}</div><button class="retro-btn pink full">Save Quick Add</button><button type="button" class="retro-btn full" style="margin-top:9px" onclick="BB.nav('add')">Full Add Mode</button><button type="button" class="retro-btn grey full" style="margin-top:9px" onclick="BB.cancelEdit()">Cancel</button></form>`,'add');}
  function add(){ const d=state.draft||{}; const isEdit=!!d.id; const incomplete=isIncomplete(d); const editCopy=incomplete?`<p class="small">This drink was saved from Quick Add. Add ingredients, measurements, and instructions to finish the recipe.</p>`:(isEdit?`<p class="small">Updating existing saved drink. Changes overwrite this drink instead of creating a duplicate.</p>`:''); const completeBlock=(isEdit&&incomplete)?`<div class="section complete-check"><label><input type="checkbox" name="recipeComplete"> <span><span class="hot mono">Recipe is complete</span><br><span class="small">Check this when ingredients, measurements, and instructions are ready enough to use.</span></span></label></div>`:''; return shell(`<h1 class="hot mono">${isEdit?'Edit Drink':'Add a New Drink'} <span style="float:right">${isEdit?'🛠️':'🍹'}</span></h1>${editCopy}<form data-drink-form="full" oninput="BB.saveDraftFromForm(this)" onsubmit="BB.saveFull(event)"><input type="hidden" name="id" value="${esc(d.id||'')}">${incomplete?'<div class="incomplete-badge">⚠ Recipe Incomplete</div>':''}${field('Drink Name','name',d.name,'e.g. Spicy Pineapple Margarita',true)}${field('Base Spirit','baseSpirit',d.baseSpirit,'e.g. Tequila')}<div class="field"><label>Ingredients</label><textarea name="ingredients" placeholder="List ingredients...">${esc(d.ingredients||'')}</textarea></div><div class="field"><label>Measurements</label><textarea name="measurements" placeholder="List measurements...">${esc(d.measurements||'')}</textarea></div><div class="field"><label>Instructions</label><textarea name="instructions" placeholder="How to make it...">${esc(d.instructions||'')}</textarea></div>${field('Garnish','garnish',d.garnish,'e.g. Pineapple wedge')}${field('Glass','glass',d.glass,'e.g. Rocks Glass')}${field('Where I Tried It','whereTried',d.whereTried,'e.g. Neon Palms Bar')}<div class="field"><label>Rating</label><select name="rating">${[5,4,3,2,1,0].map(n=>`<option value="${n}" ${Number(d.rating||4)===n?'selected':''}>${ratingStars(n)}</option>`).join('')}</select></div><div class="field"><label>Notes</label><textarea name="notes" placeholder="Any notes about this drink...">${esc(d.notes||'')}</textarea></div>${completeBlock}<div class="section"><label><input type="checkbox" name="favorite" ${d.favorite?'checked':''}> <span class="hot mono">Favorite this drink</span></label></div><div class="section"><div class="section-title">Drink Image / Placeholder</div>${imagePreview({placeholderId:state.placeholder?.id||d.placeholderId||'generic',placeholderType:state.placeholder?.type||d.placeholderType||'generic'}, {title:(state.placeholder||d.placeholderId)?'Selected placeholder':'Current placeholder'})}${!(state.placeholder||d.placeholderId)?noImagePrompt():`<div class="image-actions"><button type="button" class="retro-btn" onclick="BB.choosePlaceholder()">Change Placeholder</button><button type="button" class="retro-btn grey" onclick="BB.skipImagePrompt()">Skip for now</button></div><p class="small">Real photo upload is saved for a later 2.x update.</p>`}</div><div class="actions"><button class="retro-btn pink">💾 ${isEdit?'Update Drink':'Save Drink'}</button><button type="button" class="retro-btn grey" onclick="BB.cancelEdit()">Cancel</button></div>${isEdit?`<div class="section danger-zone"><div class="section-title">Danger Zone</div><p class="small">Delete removes this drink from Saved Drinks, Recently Opened, Favorites, and future backups.</p><button type="button" class="retro-btn full danger" onclick="BB.deleteSelected()">🗑 Delete Drink</button></div>`:''}</form>`,'add');}

  function field(label,name,val='',ph='',req=false){return `<div class="field"><label>${label}</label><input name="${name}" value="${esc(val||'')}" placeholder="${ph}" ${req?'required':''}></div>`;}
  function detail(){ const d=selected(); const incomplete=isIncomplete(d); return shell(`<h1 class="cyan mono">${esc(d.name)}</h1>${drinkThumb(d,true)}<div class="between"><div><span class="hot">♥</span> <span class="small">${esc(d.flavor||d.notes||'Saved cocktail')}</span>${recipeBadgeHTML(d)}</div><div class="stars">${ratingStars(d.rating)}</div></div><div class="detail-grid"><div>Base Spirit</div><div>${esc(d.baseSpirit||'—')}</div><div>Glass</div><div>${esc(d.glass||'—')}</div><div>Where I Tried It</div><div>${esc(d.whereTried||'—')}</div><div>Garnish</div><div>${esc(d.garnish||'—')}</div></div>${incomplete?`<div class="section recipe-incomplete-box"><div class="section-title">Recipe Incomplete</div><p class="small">This was saved from Quick Add. Add ingredients, measurements, and instructions when you are ready.</p><button class="retro-btn full" onclick="BB.finishRecipe('${d.id}')">Finish Recipe</button></div>`:''}<div class="section"><div class="section-title">Ingredients</div>${ingredientTable(d)}</div><div class="section"><div class="section-title">Notes</div><div class="small">${esc(d.notes||'No notes yet.')}</div></div><div class="actions"><button class="retro-btn blue" onclick="BB.nav('bartender')">👨‍🍳 Show Bartender</button><button class="retro-btn" onclick="BB.editSelected()">Edit Drink</button></div>`,'saved');}

  function ingredientTable(d){ const ing=(d.ingredients||'').split('\n').filter(Boolean), meas=(d.measurements||'').split('\n'); if(!ing.length) return '<p class="small">No ingredients saved yet.</p>'; return `<table class="ingredient-table">${ing.map((x,i)=>`<tr><td>${esc(x)}</td><td>${esc(meas[i]||'')}</td></tr>`).join('')}</table>`;}
  function bartender(){ const d=selected(); const recipe=[d.name,'',...(d.ingredients||'').split('\n').map((x,i)=>`${x} ${(d.measurements||'').split('\n')[i]||''}`),'',d.garnish?`Garnish: ${d.garnish}`:'',d.glass?`Glass: ${d.glass}`:'',d.notes?`Note: ${d.notes}`:''].filter(Boolean).join('\n'); return shell(`<div class="bartender-card"><h2>${esc(d.name)}</h2><div class="small" style="font-size:14px;margin-bottom:10px"><span class="hot">♥</span> ${esc(d.flavor||'Cocktail recipe')}</div><h3>INGREDIENTS</h3>${ingredientTable(d)}<h3>GARNISH</h3><p>${esc(d.garnish||'—')}</p><h3>GLASS</h3><p>${esc(d.glass||'—')}</p><h3>NOTE TO BARTENDER</h3><p>${esc(d.notes||'')}</p>${d.instructions?`<h3>INSTRUCTIONS</h3><p>${esc(d.instructions)}</p>`:''}</div><div class="actions"><button class="retro-btn grey" onclick="BB.toDetail()">Drink Detail</button><button class="retro-btn pink" onclick="BB.copyRecipe(${JSON.stringify(recipe)})">💾 Copy Recipe</button></div><button class="retro-btn full" style="margin-top:9px" onclick="BB.showDrinkPhoto()">Show Drink Photo</button>`,'saved');}

  function discover(){ return shell(`<h1 class="cyan mono">🔍 Discover</h1>${finishListHTML()}<div class="section" style="text-align:center;padding:20px 14px"><div style="font-size:44px">🍹</div><h2 class="hot mono" style="margin:8px 0">Coming Soon</h2><p class="small" style="font-size:14px;line-height:1.45">Random drink ideas and “what should I try next?” tools will live here later.</p><div class="hr"></div><p class="small">For now, Discover also helps surface unfinished Quick Add recipes so they do not get lost.</p><button class="retro-btn pink full" onclick="BB.nav('home')">Return to Saved Drinks</button></div>`,'discover');}

  function favorites(){ const favs=drinks().filter(d=>d.favorite); return shell(`<h1 class="hot mono">★ Favorites</h1><p class="small">Bookmarked Cocktails</p>${favs.length?favs.map(card).join(''):`<div class="section" style="text-align:center;padding:28px"><div style="font-size:44px">⭐</div><p>No favorite drinks yet.<br>Tap the heart on any saved drink to bookmark it.</p><button class="retro-btn" onclick="BB.nav('home')">Return to Saved Drinks</button></div>`}`,'favorites');}
  function backupStats(list=drinks()){
    const safe=Array.isArray(list)?list:[];
    return {
      total:safe.length,
      favorites:safe.filter(d=>d.favorite).length,
      placeholders:safe.filter(d=>d.placeholderId && d.placeholderId!=='generic').length,
      incomplete:safe.filter(isIncomplete).length
    };
  }
  function backupSummaryHTML(list=drinks()){
    const s=backupStats(list);
    return `<div class="backup-summary"><div class="backup-stat"><b>${s.total}</b><span>DRINKS</span></div><div class="backup-stat"><b>${s.favorites}</b><span>FAVORITES</span></div><div class="backup-stat"><b>${s.placeholders}</b><span>PLACEHOLDERS</span></div><div class="backup-stat"><b>${s.incomplete}</b><span>INCOMPLETE</span></div></div>`;
  }
  function backupPayload(){
    return {app:'Bradley’s BoozeBrowser',build:BUILD_LABEL,version:'v0.4.2.5.1',exportedAt:new Date().toISOString(),summary:backupStats(),drinks:drinks()};
  }
  function friendlyDate(value){
    if(!value) return 'Unknown';
    const date=new Date(value);
    if(Number.isNaN(date.getTime())) return String(value);
    return date.toLocaleString();
  }
  function backup(){ return shell(`<div class="backup-page"><h1 class="cyan mono">💾 Backup & Export</h1><p class="small">Your drinks are saved locally in this browser. Export backups regularly so you do not lose them.</p><div class="section"><div class="section-title">Current Local Archive</div><div class="small">This is what will be included in TXT and JSON exports.</div>${backupSummaryHTML()}</div><div class="section between"><div><div class="section-title">Export as Text</div><div class="small">Plain text file. Easy to read, print, or share.</div></div><button class="retro-btn backup-action" onclick="BB.exportText()">Export TXT</button></div><div class="section between"><div><div class="section-title">Export as JSON Backup</div><div class="small">Best backup for restoring recipe data, notes, ratings, favorites, and placeholders.</div></div><button class="retro-btn backup-action" onclick="BB.exportJSON()">Export JSON</button></div><div class="section between"><div><div class="section-title">Export Full Backup (with photos)</div><div class="small">Photo ZIP backup is saved for a later IndexedDB/photo pass.</div></div><button class="retro-btn backup-action" onclick="BB.toast('Full ZIP backup comes in a later 2.x photo update')">Export ZIP</button></div><div class="section between import-warning"><div><div class="section-title">Import JSON Backup</div><div class="small">Choose a JSON backup to preview it. Nothing is replaced until you confirm.</div></div><div><input id="jsonImport" class="import-file" type="file" accept="application/json,.json" onchange="BB.importJSON(event)"><button class="retro-btn backup-action" onclick="document.getElementById('jsonImport').click()">Import JSON</button></div></div></div>`,'backup');}
  function placeholderScreen(){ return shell(`<h1 class="hot mono">Choose a Placeholder</h1><div class="section-title">BY SPIRIT CATEGORY</div><div class="placeholder-grid">${spirits.map(p=>placeBtn(p,'spirit')).join('')}</div><div class="hr"></div><div class="section-title">BY COLOR</div><div class="placeholder-grid">${colors.map(p=>placeBtn(p,'color')).join('')}</div>`,'add');}
  function placeBtn(p,type){return `<button class="placeholder" onclick="BB.pickPlaceholder('${type}','${p[0]}')"><div class="icon">${p[1]}</div><div class="label">${p[2]}</div></button>`;}
  function loading(){ const l=state.loading||{}; return shell(`<div class="loading"><div><h1 class="cyan mono">Loading recipe...</h1><div class="hourglass">⌛</div><p class="mono">${esc(l.message||'Opening saved drink page...')}</p><div class="progress"><div class="bar"></div></div><span class="mono">55%</span></div></div>`,'saved');}
  function minimized(){ return `<div class="desktop"><div class="desktop-icons"><button class="desktop-icon" onclick="BB.nav('home')"><div class="big">🍸</div>My Drinks</button><button class="desktop-icon" onclick="BB.nav('backup')"><div class="big">💾</div>Backup</button><div class="desktop-icon"><div class="big">🗑️</div>Trash</div></div><div style="text-align:center;color:var(--hot);font-size:32px;font-family:var(--font-mono);text-shadow:0 0 10px var(--hot)">COCKTAILS<br><span style="font-size:64px">🍸</span><br><span style="font-size:14px;color:#111;background:#ff7cc5;padding:10px;display:inline-block;transform:rotate(-5deg)">Save it now.<br>Sip it later.</span></div><div class="taskbar"><button class="start-btn" onclick="BB.reopen()">▣ Start</button><button class="task-item" onclick="BB.reopen()">🍸 Bradley's BoozeBrowser</button><div class="task-clock">🔊 9:41 PM</div></div></div>`;}
  function closed(){ return `<div class="app-wrap"><div class="browser"><div class="titlebar"><span>🍸</span><span class="title">Bradley's BoozeBrowser — Closed</span><button class="winbtn">_</button><button class="winbtn">□</button><button class="winbtn" onclick="BB.reopen()">×</button></div><main class="content"><div class="closed-center"><h1>Bradley's<br>BoozeBrowser<br>is closed.</h1><div style="font-size:64px">🍸</div><p class="small">Your saved drinks are still here.</p><button class="retro-btn pink" style="font-size:18px" onclick="BB.reopen()">Reopen BoozeBrowser</button></div></main><div class="statusbar" style="bottom:0"><span class="status-left">Session ended.</span><span>🔊 9:41 PM</span></div></div></div>`;}
  function render(){ const screen=state.screen; const map={home,discover,quick,add,detail,bartender,favorites,backup,placeholder:placeholderScreen,loading,minimized,closed}; $app.innerHTML=(map[screen]||home)(); }
  function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  function formObj(form){return Object.fromEntries(new FormData(form).entries());}
  function download(name,text,type='text/plain'){const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),500);}
  function toast(msg){$toast.textContent=msg;$toast.classList.remove('hidden');setTimeout(()=>$toast.classList.add('hidden'),1500)}
  function unsavedDialog(cb){$modal.innerHTML=`<div class="modal-box"><h3>Unsaved cocktail data detected.</h3><p>Save this drink before leaving?</p><div class="actions"><button class="retro-btn pink" onclick="BB.saveDraftThenContinue()">Save Drink</button><button class="retro-btn grey" onclick="BB.discardThenContinue()">Discard</button><button class="retro-btn" onclick="BB.keepEditing()">Keep Editing</button></div></div>`;$modal.classList.remove('hidden');state.pendingNav=cb;}
  function hideModal(){$modal.classList.add('hidden');$modal.innerHTML='';}
  window.BB={
    nav:to=>navigate(to), open:id=>openSelected(id), bartender:id=>{state.selectedId=id; addRecent(id); navigate('bartender')}, finishRecipe:id=>{state.selectedId=id; addRecent(id); BB.editSelected()},
    back:()=>{ if(state.screen==='home')return; const target=state.history.pop()||'home'; navigate(target,{skipHistory:true,message:'Going back...'});},
    toDetail:()=>navigate('detail',{skipHistory:true,message:'Opening drink detail...'}),
    goHome:()=>navigate('home',{message:'Reloading home page...',clearHistory:true}), minimize:()=>{ if(state.hasUnsaved) BB.saveCurrentDraftOnly(); navigate('minimized',{message:'Minimizing app...',skipUnsaved:true}); }, maximize:()=>toast('Full browser mode comes in a later polish pass.'),
    close:()=>{ if(state.hasUnsaved) return unsavedDialog(()=>navigate('closed',{skipUnsaved:true})); $modal.innerHTML=`<div class="modal-box"><h3>Close Bradley’s BoozeBrowser?</h3><p>Your drinks are saved locally in this browser.</p><div class="actions"><button class="retro-btn pink" onclick="BB.confirmClose()">Close App View</button><button class="retro-btn grey" onclick="BB.keepEditing()">Cancel</button></div></div>`;$modal.classList.remove('hidden');},
    confirmClose:()=>{hideModal();navigate('closed',{skipUnsaved:true,message:'Closing app view...'})}, reopen:()=>navigate('home',{message:'Reopening BoozeBrowser...',clearHistory:true}), search:v=>{state.search=v; const clearBtn=document.getElementById('clearSearchBtn'); if(clearBtn) clearBtn.style.display=v?'inline-block':'none'; if(state.screen==='home'){ const pane=document.querySelector('.home-scroll'); if(pane) pane.innerHTML=homeListHTML(); } else render();},
    clearSearch:()=>{state.search=''; const input=document.getElementById('drinkSearch'); if(input) input.value=''; const clearBtn=document.getElementById('clearSearchBtn'); if(clearBtn) clearBtn.style.display='none'; const pane=document.querySelector('.home-scroll'); if(pane) pane.innerHTML=homeListHTML(); input?.focus();},
    toggleFav:id=>{const all=drinks().map(d=>d.id===id?{...d,favorite:!d.favorite,updatedAt:Date.now()}:d);saveDrinks(all);render()},
    copyRecipe:t=>navigator.clipboard?.writeText(t).then(()=>toast('Recipe copied')).catch(()=>toast('Copy blocked by browser')),
    toast, markUnsaved:()=>{state.hasUnsaved=true;},
    saveQuickDraftFromForm:form=>{state.hasUnsaved=true; const o=formObj(form); o.mode='quick'; o.rating=Number(o.rating||4); o.recipeNeededLater=!!form.recipeNeededLater?.checked; if(state.placeholder){o.placeholderType=state.placeholder.type;o.placeholderId=state.placeholder.id;} state.draft={...(state.draft||{}),...o}; localStorage.setItem(DRAFT_KEY,JSON.stringify(state.draft));},
    saveCurrentDraftOnly:()=>{const form=document.querySelector('form[data-drink-form]'); if(!form) return; if(form.dataset.drinkForm==='quick') BB.saveQuickDraftFromForm(form); else BB.saveDraftFromForm(form); toast('Draft saved locally');},
    choosePlaceholder:()=>{const form=document.querySelector('form[data-drink-form]'); if(form){ if(form.dataset.drinkForm==='quick') BB.saveQuickDraftFromForm(form); else BB.saveDraftFromForm(form); } navigate('placeholder',{skipUnsaved:true});},
    skipImagePrompt:()=>{toast('Image skipped for now');},
    saveQuickFromForm:form=>{const o=formObj(form); const now=Date.now(); const ph=state.placeholder||((state.draft?.placeholderId&&state.draft?.placeholderType)?{type:state.draft.placeholderType,id:state.draft.placeholderId}:null); const needsRecipe=!!form.recipeNeededLater?.checked; const d={id:'d'+now,name:o.name||'Untitled Drink',baseSpirit:'',ingredients:'',measurements:'',instructions:'',garnish:'',glass:'',whereTried:o.whereTried||'',rating:Number(o.rating||4),notes:o.notes||'',favorite:false,recipeNeededLater:needsRecipe,recipeIncomplete:needsRecipe,imageType:'placeholder',placeholderType:ph?.type||'generic',placeholderId:ph?.id||'generic',flavor:needsRecipe?'Recipe Incomplete':'Quick saved drink',createdAt:now,updatedAt:now,lastOpenedAt:0}; saveDrinks([d,...drinks()]); return d;},
    saveFullFromForm:form=>{const o=formObj(form); const now=Date.now(); const all=drinks(); const existingId=o.id||state.draft?.id||null; const existing=existingId?all.find(x=>x.id===existingId):null; const ph=state.placeholder||((state.draft?.placeholderId&&state.draft?.placeholderType)?{type:state.draft.placeholderType,id:state.draft.placeholderId}:null); const wasIncomplete=!!(existing?.recipeNeededLater||existing?.recipeIncomplete||state.draft?.recipeNeededLater||state.draft?.recipeIncomplete); const markedComplete=!!form.recipeComplete?.checked; const stillIncomplete=wasIncomplete&&!markedComplete; const noteFlavor=(o.notes||'').split('.')[0]; const d={...(existing||{}),id:existing?.id||('d'+now),name:o.name||'Untitled Drink',baseSpirit:o.baseSpirit||'',ingredients:o.ingredients||'',measurements:o.measurements||'',instructions:o.instructions||'',garnish:o.garnish||'',glass:o.glass||'',whereTried:o.whereTried||'',rating:Number(o.rating||0),notes:o.notes||'',favorite:!!form.favorite?.checked,recipeNeededLater:stillIncomplete,recipeIncomplete:stillIncomplete,imageType:existing?.imageType||'placeholder',placeholderType:ph?.type||existing?.placeholderType||'generic',placeholderId:ph?.id||existing?.placeholderId||'generic',flavor:stillIncomplete?'Recipe Incomplete':(noteFlavor || (existing?.flavor==='Recipe Incomplete'?'Saved cocktail':existing?.flavor) || 'Saved cocktail'),createdAt:existing?.createdAt||now,updatedAt:now,lastOpenedAt:existing?.lastOpenedAt||0}; saveDrinks(existing?all.map(x=>x.id===existing.id?d:x):[d,...all]); return d;},
    saveQuick:e=>{e.preventDefault(); const d=BB.saveQuickFromForm(e.target); localStorage.removeItem(DRAFT_KEY); state.draft=null; state.placeholder=null; state.hasUnsaved=false; state.selectedId=d.id; toast('Quick Add saved'); navigate('detail',{skipUnsaved:true});},
    saveDraftFromForm:form=>{state.hasUnsaved=true; const o=formObj(form); o.favorite=!!form.favorite?.checked; o.recipeComplete=!!form.recipeComplete?.checked; if(!o.id && state.draft?.id) o.id=state.draft.id; state.draft={...(state.draft||{}),...o}; localStorage.setItem(DRAFT_KEY,JSON.stringify(state.draft));},
    saveFull:e=>{e.preventDefault(); const d=BB.saveFullFromForm(e.target); localStorage.removeItem(DRAFT_KEY); state.draft=null; state.placeholder=null; state.hasUnsaved=false; state.selectedId=d.id; toast(d.updatedAt===d.createdAt?'Drink saved':'Drink updated'); navigate('detail',{skipUnsaved:true});},
    cancelEdit:()=>{ if(state.hasUnsaved) return unsavedDialog(()=>{localStorage.removeItem(DRAFT_KEY); state.draft=null; navigate('home',{skipUnsaved:true,clearHistory:true});}); localStorage.removeItem(DRAFT_KEY); state.draft=null; navigate('home',{skipUnsaved:true,clearHistory:true});},
    continueDraft:()=>{try{state.draft=JSON.parse(localStorage.getItem(DRAFT_KEY)||'{}')}catch(e){} if(state.draft?.placeholderId) state.placeholder={type:state.draft.placeholderType||'generic',id:state.draft.placeholderId}; navigate(state.draft?.mode==='quick'?'quick':'add',{skipUnsaved:true});}, deleteDraft:()=>{localStorage.removeItem(DRAFT_KEY);state.draft=null;state.hasUnsaved=false;render()},
    editSelected:()=>{const d=selected(); state.draft={...d}; state.placeholder=d?.placeholderId?{type:d.placeholderType||'generic',id:d.placeholderId}:null; state.hasUnsaved=false; localStorage.setItem(DRAFT_KEY,JSON.stringify(state.draft)); navigate('add',{instant:true,skipHistory:false})},
    deleteSelected:()=>{const d=state.draft?.id?drinks().find(x=>x.id===state.draft.id):selected(); if(!d) return; $modal.innerHTML=`<div class="modal-box"><h3>Delete this drink?</h3><p>${esc(d.name)} will be removed from your saved drinks and backups.</p><div class="actions"><button class="retro-btn pink" onclick="BB.confirmDeleteDrink('${d.id}')">Delete Drink</button><button class="retro-btn grey" onclick="BB.keepEditing()">Cancel</button></div></div>`; $modal.classList.remove('hidden');},
    confirmDeleteDrink:id=>{hideModal(); saveDrinks(drinks().filter(d=>d.id!==id)); localStorage.removeItem(DRAFT_KEY); try{const r=JSON.parse(localStorage.getItem(RECENT_KEY)||'[]').filter(x=>x!==id); localStorage.setItem(RECENT_KEY,JSON.stringify(r));}catch(e){} state.draft=null; state.hasUnsaved=false; state.selectedId=drinks()[0]?.id; toast('Drink deleted'); navigate('home',{skipUnsaved:true,clearHistory:true});},
    pickPlaceholder:(type,id)=>{state.placeholder={type,id}; state.hasUnsaved=true; state.draft={...(state.draft||{}),placeholderType:type,placeholderId:id}; localStorage.setItem(DRAFT_KEY,JSON.stringify(state.draft)); toast('Placeholder selected'); navigate(state.draft?.mode==='quick'?'quick':'add',{skipUnsaved:true});},
    showDrinkPhoto:()=>{const d=selected(); const meta=placeholderMeta(d); $modal.innerHTML=`<div class="modal-box"><h3>Drink Photo / Placeholder</h3><div class="photo-modal-thumb">${meta.icon}</div><p class="small"><span class="hot">${esc(d?.name||'Saved Drink')}</span><br>Showing current ${d?.imageType==='uploaded'?'drink image':meta.type.toLowerCase()}: ${esc(meta.label)}</p><div class="actions"><button class="retro-btn pink" onclick="BB.keepEditing()">Close Photo</button></div></div>`; $modal.classList.remove('hidden');},
    exportText:()=>{const text=drinks().map(d=>`${d.name}\nRating: ${ratingStars(d.rating)}\nStatus: ${isIncomplete(d)?'Recipe Incomplete':'Recipe complete / usable'}\nBase: ${d.baseSpirit||''}\nGlass: ${d.glass||''}\nGarnish: ${d.garnish||''}\nWhere: ${d.whereTried||''}\n\nIngredients:\n${d.ingredients||''}\n\nMeasurements:\n${d.measurements||''}\n\nInstructions:\n${d.instructions||''}\n\nNotes:\n${d.notes||''}\n\n---`).join('\n\n');download('bradleys-boozebrowser-backup.txt',text);toast('Download complete: backup.txt')},
    exportJSON:()=>{download('bradleys-boozebrowser-backup.json',JSON.stringify(backupPayload(),null,2),'application/json');toast('Download complete: backup.json')},
    importJSON:e=>{const file=e.target.files?.[0]; if(!file) return; const reader=new FileReader(); reader.onload=()=>{try{const data=JSON.parse(reader.result); const incoming=Array.isArray(data)?data:data.drinks; if(!Array.isArray(incoming)) throw new Error('No drinks array found'); const cleaned=incoming.filter(d=>d&&d.name).map((d,i)=>({...d,id:d.id||('imported_'+Date.now()+'_'+i),rating:Number(d.rating||0),favorite:!!d.favorite,recipeNeededLater:!!(d.recipeNeededLater||d.recipeIncomplete),recipeIncomplete:!!(d.recipeIncomplete||d.recipeNeededLater),imageType:d.imageType||'placeholder',placeholderType:d.placeholderType||'generic',placeholderId:d.placeholderId||'generic',updatedAt:d.updatedAt||Date.now(),createdAt:d.createdAt||Date.now()})); if(!cleaned.length) throw new Error('Backup contained no named drinks'); const sample=cleaned.slice(0,4).map(d=>`<li>${esc(d.name)}</li>`).join(''); const extra=cleaned.length>4?`<li>...and ${cleaned.length-4} more</li>`:''; $modal.innerHTML=`<div class="modal-box"><h3>Preview JSON Backup</h3><p class="small">Backup version: <span class="cyan">${esc(data.version||data.build||'Unknown')}</span><br>Exported: <span class="cyan">${esc(friendlyDate(data.exportedAt))}</span><br>Current archive: <span class="hot">${drinks().length}</span> drink(s)</p>${backupSummaryHTML(cleaned)}<ul class="import-preview-list">${sample}${extra}</ul><div class="hr"></div><p class="small yellow">Import will replace your current saved drink list after confirmation.</p><div class="actions"><button class="retro-btn pink" onclick="BB.confirmImport()">Replace Current Drinks</button><button class="retro-btn grey" onclick="BB.keepEditing()">Cancel</button></div></div>`; state.pendingImport=cleaned; $modal.classList.remove('hidden');}catch(err){toast('Import failed: invalid JSON backup');}}; reader.readAsText(file); e.target.value='';},
    confirmImport:()=>{if(!state.pendingImport) return; saveDrinks(state.pendingImport); localStorage.removeItem(RECENT_KEY); state.selectedId=drinks()[0]?.id; state.pendingImport=null; hideModal(); toast(`JSON backup imported: ${drinks().length} drinks`); navigate('home',{skipUnsaved:true,clearHistory:true});},
    saveDraftThenContinue:()=>{const form=document.querySelector('form[data-drink-form]'); let saved=null; if(form){ saved=form.dataset.drinkForm==='quick'?BB.saveQuickFromForm(form):BB.saveFullFromForm(form); state.selectedId=saved.id; localStorage.removeItem(DRAFT_KEY); state.draft=null; state.placeholder=null; toast(form.dataset.drinkForm==='quick'?'Quick Add saved':'Drink saved'); } else {BB.saveCurrentDraftOnly();} hideModal(); state.hasUnsaved=false; state.pendingNav?.();}, discardThenContinue:()=>{hideModal(); state.hasUnsaved=false; localStorage.removeItem(DRAFT_KEY); state.draft=null; state.placeholder=null; state.pendingNav?.();}, keepEditing:()=>{hideModal();}
  };
  setStatus(BUILD_LABEL); render();
})();
</script>
